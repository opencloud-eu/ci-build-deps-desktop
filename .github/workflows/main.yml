name: OpenCloud Desktop CI

on:
  push:
    branches:
      - main
      - 'stable-[0-9]+.[0-9]+'
      - 'stable-[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      releaseChannel:
        description: 'The release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
  schedule:
    - cron: '11 3 * * 1-5'
      timezone: "Europe/Berlin"

concurrency: 
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
# ------------------------------------------------------------------------------------------------------------------------------------------
  build:
    permissions:
      # actions/upload-artifact doesn't need contents: write
      contents: read
      actions: read
      security-events: write
    strategy:
        fail-fast: true
        matrix:
            include:
            - target: windows-cl-msvc2022-x86_64
              os: windows-2022
              container:
            - target: macos-clang-arm64
              os: macos-latest
              container:
            - target: macos-clang-x86_64
              os: macos-latest
              container:
            - target: linux-gcc-x86_64
              os: ubuntu-latest
              container: ghcr.io/opencloud-eu/ci-docker-desktop/appimage:latest

    name: ${{ matrix.target }}

    runs-on: ${{ matrix.os }}

    environment:
      # use the main environment on the main branch, it contains the required secrets
      name: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
      deployment: false

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    container: ${{ matrix.container }}

    steps:
    - name: Check out latest commit
      uses: actions/checkout@v7

    - name: Clone CraftMaster
      run: |
        git clone --depth=1 https://github.com/KDE/craftmaster.git "${home}/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      id: setup
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --output-on-failure craft
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --add-blueprint-repository "https://github.com/opencloud-eu/craft-blueprints-opencloud.git||main"

    - name: Install dependencies
      if: ${{ false }} # skip for test run
      run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --output-on-failure --install-deps opencloud/opencloud-desktop

    - name: Update Shelf
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --shelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Upload Shelf
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}-${{ github.run_number }}
        path: ${{ github.workspace }}/.craft.shelf

    - name: Upload cache
      if: always()
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c s3cmd
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run s3cmd --host "${{ vars.S3_CACHE_URL }}" --access_key "${{ secrets.S3_CACHE_ACCESS }}" --secret_key "${{ secrets.S3_CACHE_SECRET }}" put --recursive "${home}/craft/cache/" s3://craft-cache/
